version: '3.8'

services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: dify
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  redis:
    image: redis:latest
    ports:
      - '6379:6379'

  app:
    image: your-app-image
    depends_on:
      - postgres
      - redis
    ports:
      - '8080:80'
    environment:
      DATABASE_URL: postgres://user:password@postgres:5432/dify

volumes:
  postgres_data:
