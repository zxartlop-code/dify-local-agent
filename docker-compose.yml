version: '3.8'

# Conway's Game of Life — deployable cellular automaton
# Services:
#   backend  – FastAPI, exposes REST API on port 8000
#   frontend – nginx serving the SPA, proxies /api/* to backend
#
# Usage:
#   docker compose up --build        # first run
#   docker compose up -d             # detached
#   docker compose down              # stop & remove containers

services:
  # -----------------------------------------------------------------------
  # Backend: Conway Game of Life REST API (FastAPI + uvicorn)
  # -----------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: conway-backend:latest
    container_name: conway-backend
    restart: unless-stopped
    ports:
      - '8000:8000'
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # -----------------------------------------------------------------------
  # Frontend: nginx serving static SPA
  # Opens on http://localhost:3000
  # Set the API URL in the sidebar to http://localhost:8000
  # (or http://localhost:3000/api if using the nginx proxy path)
  # -----------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: conway-frontend:latest
    container_name: conway-frontend
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      backend:
        condition: service_healthy
