# Conway's Game of Life — CircleCI CI/CD Pipeline
# Pipeline stages:
#   1. test-backend  : lint & unit-test the FastAPI backend
#   2. build-images  : build Docker images for backend + frontend
#   3. integration   : smoke-test the running stack with docker compose
#   4. publish       : push images to Docker Hub (main branch only)
version: 2.1

# ---------------------------------------------------------------------------
# Orbs
# ---------------------------------------------------------------------------
orbs:
  python: circleci/python@2.1.1

# ---------------------------------------------------------------------------
# Reusable commands
# ---------------------------------------------------------------------------
commands:
  docker_login:
    description: "Log in to Docker Hub using context credentials"
    steps:
      - run:
          name: Docker Hub login
          command: |
            echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # --------------------------------------------------------------------------
  # 1. Backend unit tests
  # --------------------------------------------------------------------------
  test-backend:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - python/install-packages:
          pkg-manager: pip
          pip-dependency-file: backend/requirements.txt
      - run:
          name: Install test dependencies
          command: pip install httpx pytest pytest-asyncio
      - run:
          name: Run backend unit tests
          command: |
            cd backend
            python -m pytest ../tests/test_backend.py -v --tb=short
      - store_test_results:
          path: test-results

  # --------------------------------------------------------------------------
  # 2. Build Docker images
  # --------------------------------------------------------------------------
  build-images:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Build backend image
          command: docker build -t conway-backend:ci ./backend
      - run:
          name: Build frontend image
          command: docker build -t conway-frontend:ci ./frontend
      - run:
          name: Verify images exist
          command: |
            docker images conway-backend:ci
            docker images conway-frontend:ci

  # --------------------------------------------------------------------------
  # 3. Integration smoke test
  # --------------------------------------------------------------------------
  integration:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - run:
          name: Start full stack
          command: docker compose up --build -d
      - run:
          name: Wait for backend health
          command: |
            for i in $(seq 1 20); do
              STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || true)
              if [ "$STATUS" = "200" ]; then
                echo "Backend is healthy (attempt $i)"
                break
              fi
              echo "Waiting for backend... attempt $i (status=$STATUS)"
              sleep 3
            done
            [ "$STATUS" = "200" ] || (echo "Backend never became healthy"; exit 1)
      - run:
          name: Smoke test — health endpoint
          command: curl -sf http://localhost:8000/health
      - run:
          name: Smoke test — list presets
          command: curl -sf http://localhost:8000/presets | python3 -m json.tool
      - run:
          name: Smoke test — random grid
          command: |
            curl -sf -X POST http://localhost:8000/random \
              -H 'Content-Type: application/json' \
              -d '{"rows":10,"cols":10,"density":0.3}' | python3 -m json.tool
      - run:
          name: Smoke test — step API
          command: |
            GRID=$(python3 -c "
            import json, random
            grid=[[random.randint(0,1) for _ in range(10)] for _ in range(10)]
            print(json.dumps({'grid':grid,'generation':0,'steps':5}))
            ")
            curl -sf -X POST http://localhost:8000/step \
              -H 'Content-Type: application/json' \
              -d "$GRID" | python3 -m json.tool
      - run:
          name: Smoke test — frontend reachable
          command: |
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000)
            echo "Frontend HTTP status: $STATUS"
            [ "$STATUS" = "200" ] || (echo "Frontend not reachable"; exit 1)
      - run:
          name: Tear down stack
          command: docker compose down
          when: always

  # --------------------------------------------------------------------------
  # 4. Publish images to Docker Hub  (main branch only)
  # --------------------------------------------------------------------------
  publish:
    machine:
      image: ubuntu-2204:current
    steps:
      - checkout
      - docker_login
      - run:
          name: Build & push backend
          command: |
            docker build -t "$DOCKER_USERNAME/conway-backend:latest" \
                         -t "$DOCKER_USERNAME/conway-backend:${CIRCLE_SHA1:0:7}" \
                         ./backend
            docker push "$DOCKER_USERNAME/conway-backend:latest"
            docker push "$DOCKER_USERNAME/conway-backend:${CIRCLE_SHA1:0:7}"
      - run:
          name: Build & push frontend
          command: |
            docker build -t "$DOCKER_USERNAME/conway-frontend:latest" \
                         -t "$DOCKER_USERNAME/conway-frontend:${CIRCLE_SHA1:0:7}" \
                         ./frontend
            docker push "$DOCKER_USERNAME/conway-frontend:latest"
            docker push "$DOCKER_USERNAME/conway-frontend:${CIRCLE_SHA1:0:7}"

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  conway-pipeline:
    jobs:
      # Always run lint + unit tests
      - test-backend

      # Build images after tests pass
      - build-images:
          requires:
            - test-backend

      # Integration test after images build
      - integration:
          requires:
            - build-images

      # Publish to Docker Hub on main branch only
      - publish:
          requires:
            - integration
          filters:
            branches:
              only: main
          context:
            - docker-hub-credentials   # set DOCKER_USERNAME / DOCKER_PASSWORD here